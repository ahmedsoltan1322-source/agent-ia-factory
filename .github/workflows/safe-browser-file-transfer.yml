name: Safe Browser File Transfer

on:
  workflow_dispatch:
    inputs:
      plan_json:
        description: 'Approved Phase 7B file-transfer JSON. Public non-sensitive upload-preview text only; never paste secrets/personal credentials.'
        required: true
        type: string
      approved:
        description: 'I explicitly approve this bounded file-transfer plan.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  safe-file-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout factory code without persisted token (جلب كود المصنع)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Setup Node (إعداد نود)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned factory dependencies only (تثبيت تبعيات المصنع)
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Require second human approval and write bounded transfer plan (موافقة ثانية)
        env:
          TRANSFER_PLAN_JSON: ${{ inputs.plan_json }}
          WORKFLOW_APPROVED: ${{ inputs.approved }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          if os.environ.get('WORKFLOW_APPROVED', '').lower() != 'true':
              sys.exit('File-transfer workflow requires explicit approved=true.')
          raw = os.environ.get('TRANSFER_PLAN_JSON', '')
          if not raw or len(raw) > 48000:
              sys.exit('File-transfer plan missing or too large.')
          plan = json.loads(raw)
          if plan.get('approvedByHuman') is not True:
              sys.exit('Exported transfer plan itself is not human-approved.')
          policy = plan.get('policy') or {}
          if policy.get('allowExternalUpload') is not False or policy.get('allowSubmit') is not False:
              sys.exit('External upload/submit capability is forbidden in Phase 7B.')
          pathlib.Path('browser-file-transfer.json').write_text(json.dumps(plan, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Two-layer approval: PASS')
          PY

      - name: Detect preinstalled system Chrome without downloading (اكتشاف المتصفح فقط)
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_PATH" ]; then
            echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
            echo 'System Chrome available for upload_preview.'
          else
            echo 'System Chrome not found. Download-only plans remain possible; upload_preview will fail closed.'
          fi

      - name: Install isolated UID network sandbox (عزل المستخدم والشبكة)
        run: sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash scripts/setup-browser-file-transfer-sandbox.sh browsertransfer

      - name: Execute approved bounded file-transfer plan (تنفيذ النقل المحدود)
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          NODE_DIR="$(dirname "$NODE_BIN")"
          sudo -u browsertransfer -H env -i \
            HOME=/home/browsertransfer \
            PATH="$NODE_DIR:/usr/bin:/bin" \
            CHROME_PATH="${CHROME_PATH:-}" \
            CI=true \
            "$NODE_BIN" scripts/run-browser-file-transfer.mjs browser-file-transfer.json

      - name: Remove transfer plan and expose evidence read-only (تنظيف الخطة)
        if: always()
        run: |
          rm -f browser-file-transfer.json
          if [ -d browser-transfer-artifacts ]; then
            sudo find browser-transfer-artifacts -type d -exec chmod 0555 {} +
            sudo find browser-transfer-artifacts -type f -exec chmod 0444 {} +
          fi

      - name: Summarize policy-only result (تلخيص دون محتوى الملف)
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          report_path = pathlib.Path('browser-transfer-artifacts/transfer-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('# Safe Browser File Transfer\n\n')
              out.write('- Phase 7A read-only browser contract: unchanged.\n')
              out.write('- Network: GET/HEAD/OPTIONS only; no external upload/submit.\n')
              out.write('- Download capture: same-host, no redirects/auth/cookies, bounded to 5 MB, MIME + executable/archive magic gate.\n')
              out.write('- Upload preview: text/plain <=16 KB, JavaScript disabled, no external upload.\n')
              out.write('- Browser/transfer process: isolated Linux UID with Phase 7A private-network firewall.\n')
              out.write('- Plan JSON removed before artifact upload.\n')
              out.write('- Mandatory monetary spend: 0 USD.\n')
              if report_path.is_file():
                  report = json.loads(report_path.read_text('utf-8'))
                  out.write(f"- Status: `{report.get('status', 'unknown')}`\n")
                  out.write(f"- Operations recorded: {len(report.get('operations') or [])}\n")
                  out.write(f"- External upload allowed: {report.get('externalUploadAllowed')}\n")
                  out.write(f"- Submit allowed: {report.get('submitAllowed')}\n")
                  for item in report.get('operations') or []:
                      if item.get('kind') == 'download_capture':
                          out.write(f"- Download `{item.get('id','')}`: {item.get('bytes',0)} bytes, MIME `{item.get('mimeType','')}`, SHA-256 recorded.\n")
                      elif item.get('kind') == 'upload_preview':
                          out.write(f"- Upload preview `{item.get('id','')}`: {item.get('bytes',0)} bytes, externalUploadPerformed={item.get('externalUploadPerformed')}.\n")
              else:
                  out.write('- Report: unavailable because execution failed before report generation.\n')
          PY

      - name: Upload one-day bounded transfer evidence (رفع الأدلة ليوم واحد)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-browser-file-transfer-evidence
          path: browser-transfer-artifacts/
          if-no-files-found: warn
          retention-days: 1
