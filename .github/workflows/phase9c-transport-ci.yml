name: Phase 9C Authenticated Transport CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout (جلب الكود)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Setup Node (إعداد نود)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python (إعداد بايثون)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned factory dependencies (تثبيت تبعيات المصنع)
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Full Phase 0-9C validation and production build (فحص كامل)
        run: npm run check

      - name: Phase 8 deterministic regression smoke (اختبار عدم التراجع)
        run: npm run test:phase8

      - name: Phase 9A durable queue regression smoke (اختبار الطابور)
        run: npm run test:phase9a

      - name: Phase 9B portable worker regression smoke (اختبار العامل)
        run: npm run test:phase9b

      - name: Phase 9C authenticated transport smoke (اختبار النقل الموثّق)
        run: npm run test:phase9c

      - name: Production dependency audit (فحص تبعيات الإنتاج)
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit including CI runtimes (فحص كامل للتبعيات)
        run: npm audit --audit-level=high