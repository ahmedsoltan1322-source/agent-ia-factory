name: Phase 1 Mobile Core CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase-1-single-agent-core

permissions:
  contents: read

jobs:
  mobile-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (جلب الكود)
        uses: actions/checkout@v4

      - name: Setup Node (إعداد نود)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python (إعداد بايثون)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (تثبيت التبعيات)
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Foundation and policy checks (فحص الأساس والسياسات)
        run: npm run validate:foundation && npm run validate:phase1

      - name: TypeScript and production build (فحص الأنواع وبناء الإنتاج)
        run: npm run build

      - name: Production dependency audit (فحص ثغرات تبعيات الإنتاج)
        run: npm audit --omit=dev --audit-level=high
